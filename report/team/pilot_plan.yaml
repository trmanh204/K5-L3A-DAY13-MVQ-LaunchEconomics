# Lab 13 · Nhiệm vụ D · Kế hoạch pilot LogiX-VN · Gate 2a
# Kế hoạch đề xuất, chưa triển khai; ngày giờ GMT+7.
# Nguồn: đề gốc và docs/Lab13_Huong_dan_chi_tiet_buoi_chieu.md, nhiệm vụ D.
# D1: baseline 0,70; alpha 0,05 hai phía; power 0,80; ICC 0,02.
# a) Theo yêu cầu: 1.251 yêu cầu/nhóm, DE=1.
# b) m=75: DE=2,48; ceil(1.251*2,48)=3.103 yêu cầu/nhóm;
#    42 người/nhóm, tổng 84 > 40 nên không khả thi.
# c) 20 người/nhóm: n hiệu dụng < 20/0,02=1.000 < 1.251; tăng m không đủ.
# d) 6 depot/nhóm: n hiệu dụng < 300; chỉ 6 cụm/nhóm, dưới 20.
# e) 859 hiệu dụng/nhóm cho +6 điểm (đề cho):
#    20m/(0,98+0,02m)>=859 -> m>=298,52 -> 299 yêu cầu/người.
#    DE=6,96; 5.980 yêu cầu thực/nhóm; n hiệu dụng=859,20.
# D2:
# 1) 20 người đối chứng và 20 người can thiệp chạy cùng kỳ, cùng 12 depot.
# 2) Bốc thăm phân tầng depot với seed=20261121 trước rollout, giữ nhóm cố định.
# 3) Nguy cơ chia sẻ gợi ý: tách tài khoản, cấm chia sẻ, kiểm log truy cập mỗi ngày.
# 4) Chốt chỉ số, MDE, luật dừng, cỡ mẫu, quyết định 05/01/2027 trước chạy.
# 5) Đúng 20 cụm/nhóm; chỉ đo chính khi đủ 20 người can thiệp.
# Đánh đổi: MDE 6 điểm; power cho tác động thật +5 điểm chỉ 0,642.
# Yêu cầu kinh doanh vẫn +5 điểm; không phát hiện khác biệt không có nghĩa không có lợi ích.
# D3: toàn mẫu mở lại 51/1.200=4,25%; phạm vi 39/982=3,97%.
# Ngưỡng 3% bị vượt ở dữ liệu nền; chọn >6% hoặc chênh đối chứng >=2 điểm.
# Chỉ dùng cohort đủ theo dõi 7 ngày; hoàn trùng dừng ngay.
pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang tại D01–D12; CPS 2.696 đ và 8.221 đ (simulated). Loại quoc_te 22.515 đ và doi_tac 10.215 đ (simulated). Tối đa 2 lần chạy; ngoài phạm vi chuyển nhân viên."
  assignment:
    unit: staff
    control_share: 0.5
    randomized: true
    seed: 20261121
    staff_per_arm: 20
    procedure: "Chốt danh sách 40 người thuộc 12 depot; xáo trộn theo seed trong từng depot, chia đôi; bốc thăm phần lẻ với ràng buộc đủ 20/20. Lưu danh sách trước chạy; không dùng danh sách 6 depot của mẫu làm danh sách triển khai."
    routing: "Phân phối ca đủ điều kiện cân bằng theo depot, loại và ca làm trước xử lý; không chọn ca dễ hoặc đổi nhóm sau khi thấy kết quả."
  rollout: [0.10, 0.25, 0.50]
  schedule:
    start_date: "2026-11-23"
    phase_10: "23–29/11/2026: 4/40 người, xem lại 100%."
    phase_25: "30/11–06/12/2026: 10/40 người gồm 4 người ban đầu, xem lại 100%."
    phase_50: "07–27/12/2026: 20/40 người gồm 10 người ban đầu; 20 người đối chứng cố định."
    measurement_start: "2026-12-07"
    enrollment_end: "2026-12-27"
    followup_end: "2027-01-03"
    freeze_date: "2027-01-04"
    phase_gate: "Chỉ tăng bước khi cohort an toàn đủ 7 ngày và không có cảnh báo chưa xử lý; thiếu mẫu thì giữ bước. Trễ bước không tự đổi ngày chốt hoặc gộp ramp-up vào kiểm định chính."
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    definition: "Số yêu cầu đóng trong 24 giờ VÀ không mở lại 7 ngày / toàn bộ yêu cầu đủ điều kiện phân cho nhóm trong kỳ đo có đủ theo dõi 7 ngày."
    baseline: 0.70
    business_minimum_lift: 0.05
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 5980
    effective_n_per_arm_required: 859
    effective_n_per_arm_planned: 859.1954022988506
    requests_per_staff: 299
    design_effect: 6.96
    clusters_per_arm: 20
    sample_gate: "n_per_arm là số thực. Đếm 299 yêu cầu liên tiếp đầu tiên/người trong kỳ đo, đủ 20 người/nhóm. Thiếu mẫu hoặc ICC thực lớn hơn giả định thì chưa đủ bằng chứng; không mở rộng hoặc đổi MDE sau khi xem kết quả."
    analysis: "Phân tích theo nhóm phân ban đầu kể cả không dùng, lỗi và chuyển nhân viên; ước lượng chênh lệch tỉ lệ, khoảng tin cậy 95%, điều chỉnh cụm staff và phân tầng depot. DE là xấp xỉ lập kế hoạch, không thay phân tích theo cụm."
  identifiability:
    concurrent_control: "20 người tự làm theo quy trình cũ, cùng depot và kỳ 07–27/12; khóa quyền xem trợ lý."
    spillover_risk: "Có thể chia sẻ gợi ý trong depot; tách tài khoản, cấm chia sẻ, kiểm access_event theo staff_id mỗi ngày; ghi vi phạm, giữ phân tích theo nhóm ban đầu. Kinh nghiệm ramp-up là một phần can thiệp."
    predeclared: "Trước 23/11 chốt seed, nhóm, chỉ số, kỳ đo, mẫu, luật dừng và ngày 05/01/2027; không xem hiệu quả giữa kỳ để dừng sớm."
  review_policy:
    initial: "Xem lại 100% tại bước 10% và 25%; ghi phút xem và làm lại thực tế."
    measurement: "Giữ 100% xem lại trong kỳ đo để không đổi can thiệp; chỉ thử giảm xem lại trong một kế hoạch riêng sau quyết định."
    economic_tradeoff: "B4: 11.743 đ/việc với 9 phút làm lại hoặc 12.415 đ với trung bình 15,3 phút (simulated); gần hoặc vượt baseline 12.000 đ, pilot có thể không đạt kinh tế."
  monitoring:
    matured_cohort: "Mở lại tính trên cohort đủ 7 ngày; kiểm mỗi ngày, cửa sổ 7 ngày gần nhất có >=100 yêu cầu/nhóm. Thiếu mẫu thì giữ bước, vẫn rà từng sự cố."
    actual_cost: "Token + tool + phút xem/làm lại thực tế *2.000 đ, chia việc thành công đủ 7 ngày; báo thêm nhân viên làm thay 12.000 đ/ca không thành công và cố định 40 triệu đ/tháng theo khối lượng thực. Không cộng lại tiền chạy lại đã nằm trong token/tool."
    adoption: "Yêu cầu có sua hoặc bo / yêu cầu được xem lại; đếm request_id duy nhất từ review_decision có trace_id."
    schedule: "An toàn và truy cập kiểm mỗi ngày; chi phí và sử dụng kiểm cuối tuần để vận hành. Chỉ số chính chỉ mở sau đóng dữ liệu."
  stop_rules:
    - "NẾU có >=1 ca hoàn trùng hoặc ghi sổ sai tiền xác nhận TRONG bất kỳ lần đối soát nào THÌ Giám đốc vận hành tắt trợ lý trong 30 phút, Kế toán trưởng rà giao dịch liên quan KHÔNG THÌ không được tăng bước khi sự cố chưa đóng."
    - "NẾU mở lại nhóm trợ lý >6% hoặc cao hơn đối chứng >=2 điểm phần trăm TRONG 3 lần kiểm hằng ngày liên tiếp trên cohort đủ 7 ngày, >=100 yêu cầu mỗi nhóm/lần THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và chuyển nhân viên KHÔNG THÌ không được tăng bước khi thiếu mẫu hoặc cảnh báo chưa xác minh."
    - "NẾU chi phí mỗi việc thành công thực đo >12.000 đ TRONG 2 báo cáo tuần liên tiếp có >=100 yêu cầu đủ theo dõi/báo cáo THÌ Giám đốc vận hành dừng nhận ca mới trong 1 ngày, PM lập lại phương án trước khi xin pilot mới KHÔNG THÌ không được mở thêm người hoặc depot khi chưa có báo cáo; không tự đổi phạm vi trong kỳ đo."
    - "NẾU tỉ lệ sua hoặc bo >40% TRONG 1 tuần có >=50 yêu cầu xem lại THÌ Trưởng nhóm CSKH khóa mở rộng, phỏng vấn 5 nhân viên trong 3 ngày, đề nghị Giám đốc vận hành dừng nếu chưa khắc phục sau 7 ngày KHÔNG THÌ không được tăng bước khi thiếu mẫu hoặc chưa có kết luận xử lý."
  interim_looks: "Chỉ kiểm tra an toàn để dừng khẩn cấp; chi phí và sử dụng là kiểm tra vận hành theo lịch; không xem chênh lệch chỉ số chính hoặc p-value giữa kỳ."
  rollback: "Giám đốc vận hành ra lệnh, Kỹ sư trưởng agent tắt feature flag trong 30 phút; giữ audit log, khóa lệnh mới, đối soát lệnh chờ để tránh hoàn trùng; chuyển ca chưa xong sang nhân viên theo quy trình 6 phút/ca. Chỉ mở lại theo kế hoạch mới được duyệt."
  decision_date: "2027-01-05"
  decision_rule: "Chỉ đề nghị mở rộng pilot khi đủ mẫu, chênh lệch ước lượng >=5 điểm, khoảng tin cậy 95% điều chỉnh cụm loại 0, đạt an toàn và chi phí cả hệ thống gồm cố định <=12.000 đ/yêu cầu ở khối lượng ghi rõ. Ước lượng >=5 điểm không chứng minh cận dưới tác động >=5; thiếu mẫu hoặc chưa đạt kinh tế/an toàn thì chưa mở rộng và trình kế hoạch sửa."
  simulated_inputs:
    - "Toàn bộ CSV là dữ liệu giả lập của lab, không phải pilot có đối chứng."
    - "Giả định đề: 12 depot, 40 người, 1.500 yêu cầu/ngày; baseline=0,70, ICC=0,02, mục tiêu +5 điểm."
    - "Thiết kế đề xuất: MDE=6 điểm, alpha=0,05, power=0,80, seed=20261121; 20 cụm/nhóm, 299 yêu cầu/cụm, DE=6,96; 5.980 thực và 859,20 hiệu dụng/nhóm."
    - "D1 trong lab13.py: 1.251, 3.103, 42 người/nhóm, trần 1.000 và 300; power 5 điểm=0,642."
    - "Mở lại: 51/1.200=4,25%; trong phạm vi: 39/982=3,97%."
    - "Chi phí simulated A3: 2.696, 8.221, 22.515, 10.215 đ/việc; B4: 11.743 và 12.415 đ/việc, 5 phút xem, 9 hoặc trung bình 15,3 phút làm lại."
    - "Giá giả định: 26/130 đ/1.000 token vào/ra, 15 đ/tool, 2.000 đ/phút, 12.000 đ/ca tự làm, cố định 40 triệu đ/tháng."
    - "Ngưỡng/lịch đề xuất: 6%, +2 điểm, 1 sự cố, 3 lần kiểm, >=100 yêu cầu; 12.000 đ trong 2 tuần; >40% với >=50 lượt xem, 5 phỏng vấn; rollback 30 phút; rollout 4/10/20 người."
